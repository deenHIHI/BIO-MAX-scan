
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BIO-MAX Plant Scanner</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #f5f5eb;
      color: #293b2b;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 650px;
      margin: auto;
    }

    .header, .panel {
      padding: 24px;
      margin-bottom: 18px;
      border-radius: 18px;
    }

    .header { background: #e4ebdc; }
    .panel { background: white; border: 1px solid #e0e6da; }

    .eyebrow {
      color: #58734c;
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 12px;
    }

    .upload {
      display: block;
      padding: 20px;
      border: 2px dashed #b8c7ae;
      border-radius: 12px;
    }

    input { width: 100%; margin-top: 12px; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: #526b45;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    #preview {
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin-top: 16px;
      border-radius: 12px;
    }

    #status { line-height: 1.5; overflow-wrap: anywhere; }

    .result {
      padding: 14px;
      margin-top: 12px;
      border-radius: 12px;
      background: #f8f9f4;
    }

    .score {
      height: 8px;
      background: #e1e8dc;
      border-radius: 10px;
      overflow: hidden;
    }

    .score div {
      height: 100%;
      background: #6e8c5b;
    }

    .muted { color: #687465; font-size: 13px; }
  </style>
</head>

<body>
<main>
  <header class="header">
    <div class="eyebrow">BIO-MAX · PLANT CARE</div>
    <h1>Plant Scanner</h1>
    <p>Upload a photo to identify your plant.</p>
  </header>

  <section class="panel">
    <h2>Identify a Plant</h2>

    <label class="upload">
      Choose a plant photo
      <input id="plantImage" type="file"
        accept="image/jpeg,image/png,image/webp">
    </label>

    <img id="preview" alt="Selected plant preview">

    <button id="scanButton" type="button">Identify Plant</button>
    <p id="status" role="status"></p>
  </section>

  <section class="panel" id="results" hidden>
    <h2>Possible Matches</h2>
    <div id="resultList"></div>
  </section>
</main>

<script>
  // We will connect your API key safely in the next step.
  const API_KEY = "ADD_API_KEY_LATER";

  const imageInput = document.getElementById("plantImage");
  const preview = document.getElementById("preview");
  const scanButton = document.getElementById("scanButton");
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const resultList = document.getElementById("resultList");

  let selectedFile = null;

  imageInput.addEventListener("change", () => {
    selectedFile = imageInput.files[0] || null;
    resultList.replaceChildren();
    resultsBox.hidden = true;
    statusBox.textContent = "";

    if (!selectedFile) {
      preview.style.display = "none";
      return;
    }

    if (!["image/jpeg", "image/png", "image/webp"]
        .includes(selectedFile.type)) {
      selectedFile = null;
      imageInput.value = "";
      preview.style.display = "none";
      statusBox.textContent = "Please select a JPG, PNG, or WebP image.";
      return;
    }

    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = "block";
  });

  scanButton.addEventListener("click", identifyPlant);

  async function identifyPlant() {
    if (!selectedFile) {
      statusBox.textContent = "Please choose a plant photo first.";
      return;
    }

    if (API_KEY === "ADD_API_KEY_LATER") {
      statusBox.textContent =
        "The scanner is ready, but the API connection has not been configured yet.";
      return;
    }

    scanButton.disabled = true;
    scanButton.textContent = "Identifying...";
    statusBox.textContent = "Contacting Pl@ntNet...";
    resultsBox.hidden = true;
    resultList.replaceChildren();

    try {
      const formData = new FormData();
      formData.append("images", selectedFile);
      formData.append("organs", "auto");

      const url =
        "https://my-api.plantnet.org/v2/identify/all" +
        "?api-key=" + encodeURIComponent(API_KEY) +
        "&lang=en&nb-results=5";

      const response = await fetch(url, {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || "HTTP " + response.status);
      }

      if (!data.results || !data.results.length) {
        statusBox.textContent = "No likely matches found. Try another photo.";
        return;
      }

      statusBox.textContent = "Identification complete.";

      data.results.forEach((item, index) => {
        const species = item.species || {};
        const name =
          species.scientificNameWithoutAuthor ||
          species.scientificName || "Unknown species";
        const score = Math.max(0, Math.min(100, (item.score || 0) * 100));

        const card = document.createElement("article");
        card.className = "result";

        const title = document.createElement("h3");
        title.textContent = (index === 0 ? "🌿 " : "") + name;

        const common = document.createElement("p");
        common.className = "muted";
        common.textContent = (species.commonNames || []).slice(0, 3).join(", ")
          || "Common name unavailable";

        const scoreText = document.createElement("p");
        scoreText.textContent = "Match score: " + score.toFixed(1) + "%";

        const bar = document.createElement("div");
        bar.className = "score";

        const fill = document.createElement("div");
        fill.style.width = score + "%";
        bar.appendChild(fill);

        card.append(title, common, scoreText, bar);
        resultList.appendChild(card);
      });

      resultsBox.hidden = false;

    } catch (error) {
      statusBox.textContent =
        "Identification failed: " + error.message +
        ". Check the API setup and authorization settings.";
    } finally {
      scanButton.disabled = false;
      scanButton.textContent = "Identify Plant";
    }
  }
</script>
</body>
</html>
